services:
  - type: web
    name: portfolio-compiler
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
    disk:
      name: portfolio-storage
      mountPath: /app/uploads
      sizeGB: 1
